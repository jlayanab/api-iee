version: '3.8'

services:
  api:
    build: .
    container_name: api_iee_app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/ieedb?authSource=admin
      - SECRET=ieeproyectos-api-secret-key-change-in-production
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - pdfs_data:/usr/src/app/pdfs

  mongodb:
    image: mongo:6.0
    container_name: api_iee_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  pdfs_data:
